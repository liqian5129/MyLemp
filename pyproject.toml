[project]
name = "lelamp-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feetech-servo-sdk>=1.0.0",
    "lerobot>=0.3.3",
    "livekit-agents[openai]~=1.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "numpy>=2.2.6",
    "pvporcupine>=3.0.5",
    "pvrecorder>=1.2.7",
    "pyarrow==20.0.0",
    "pyaudio>=0.2.14",
    "python-dotenv",
    "sounddevice>=0.5.2",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "funasr>=1.1.0",
    "modelscope>=1.9.0",
    "websocket-client>=1.6.0",
    "websockets>=12.0",
    "pynput>=1.7.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-socks>=2.8.1",
    "torchaudio>=2.6.0",
]

[tool.uv.sources]
lerobot = { git = "https://github.com/huggingface/lerobot" }

[project.optional-dependencies]
hardware = [
    "adafruit-circuitpython-neopixel",
    "rpi-ws281x",
]
